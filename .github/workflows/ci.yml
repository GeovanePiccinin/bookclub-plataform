name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: software_starter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d software_starter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/software_starter_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure isolated test and build databases
        run: |
          PGPASSWORD=test createdb --host=127.0.0.1 --port=5432 --username=test software_starter_build
          printf 'DATABASE_URL=postgresql://test:test@127.0.0.1:5432/software_starter_test?schema=public\nTEST_DATABASE_URL=postgresql://test:test@127.0.0.1:5432/software_starter_test?schema=public\n' > .env.test

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: TypeScript
        run: pnpm typecheck

      - name: Run migrations
        run: pnpm db:migrate:test

      - name: Tests
        run: pnpm test:run

      - name: Migrate isolated build database
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/software_starter_build pnpm db:migrate:production

      - name: Build
        run: DATABASE_URL=postgresql://test:test@127.0.0.1:5432/software_starter_build pnpm build

  migrate-preview:
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    environment: preview
    concurrency:
      group: preview-db-migrations
      cancel-in-progress: false
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply pending preview migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PREVIEW_MIGRATION_EXPECTED_HOST: ${{ vars.PREVIEW_MIGRATION_EXPECTED_HOST }}
          PREVIEW_MIGRATION_EXPECTED_PORT: ${{ vars.PREVIEW_MIGRATION_EXPECTED_PORT }}
          PREVIEW_MIGRATION_EXPECTED_DATABASE: ${{ vars.PREVIEW_MIGRATION_EXPECTED_DATABASE }}
          PREVIEW_MIGRATION_EXPECTED_USER: ${{ vars.PREVIEW_MIGRATION_EXPECTED_USER }}
        run: pnpm db:migrate:preview

      - name: Seed preview demonstration data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PREVIEW_MIGRATION_EXPECTED_HOST: ${{ vars.PREVIEW_MIGRATION_EXPECTED_HOST }}
          PREVIEW_MIGRATION_EXPECTED_PORT: ${{ vars.PREVIEW_MIGRATION_EXPECTED_PORT }}
          PREVIEW_MIGRATION_EXPECTED_DATABASE: ${{ vars.PREVIEW_MIGRATION_EXPECTED_DATABASE }}
          PREVIEW_MIGRATION_EXPECTED_USER: ${{ vars.PREVIEW_MIGRATION_EXPECTED_USER }}
          DEMO_ADMIN_EMAIL: ${{ secrets.DEMO_ADMIN_EMAIL }}
          DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}
        run: pnpm db:seed:preview

  production-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    uses: ./.github/workflows/prod-db-setup.yml
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
